<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BA/SA Materials</title>

  <script>
    // Gramax static builds persist settings under this Zustand key.
    window.__GRAMAX_SETTINGS_KEY__ = "app-settings-cache";

    window.__readGramaxTheme__ = function () {
      try {
        const raw = localStorage.getItem(window.__GRAMAX_SETTINGS_KEY__);
        if (raw) {
          const parsed = JSON.parse(raw);
          const theme = parsed?.state?.values?.general?.theme;
          if (theme === "dark" || theme === "light") return theme;
        }
      } catch {}

      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    };

    window.__setGramaxTheme__ = function (theme) {
      try {
        const key = window.__GRAMAX_SETTINGS_KEY__;
        const raw = localStorage.getItem(key);

        let parsed = raw
          ? JSON.parse(raw)
          : { state: { values: {} }, version: 1 };

        parsed.state ??= {};
        parsed.state.values ??= {};
        parsed.state.values.general ??= {};
        parsed.state.values.general.theme = theme;

        if (parsed.version == null) parsed.version = 1;

        localStorage.setItem(key, JSON.stringify(parsed));
      } catch {}

      document.body?.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-theme", theme);
    };

    document.documentElement.setAttribute("data-theme", window.__readGramaxTheme__());
  </script>

  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #fff;
      --surface-hover: #f5f6f8;
      --text: #20242b;
      --muted: #737a84;
      --border: #dfe3e8;
      --header-bg: rgba(248,249,251,.84);
      --shadow: 0 2px 5px rgba(20,24,31,.08);
      --overlay: rgba(15,18,22,.42);
    }

    [data-theme="dark"] {
      --bg: #111214;
      --surface: #1b1d20;
      --surface-hover: #24272c;
      --text: #f0f1f3;
      --muted: #a0a6af;
      --border: #32363c;
      --header-bg: rgba(17,18,20,.86);
      --shadow: 0 2px 6px rgba(0,0,0,.28);
      --overlay: rgba(0,0,0,.62);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
      background: var(--header-bg);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      width: min(1144px, calc(100% - 48px));
      min-height: 58px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .workspace-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--text);
      text-decoration: none;
      font-size: 17px;
      font-weight: 500;
    }

    .workspace-brand svg {
      flex: 0 0 auto;
    }

    .workspace-brand-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .workspace-brand-logo.dark {
      display: none;
    }

    [data-theme="dark"] .workspace-brand-logo.light {
      display: none;
    }

    [data-theme="dark"] .workspace-brand-logo.dark {
      display: block;
    }

    .workspace-brand span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-button:hover {
      background: var(--surface-hover);
    }

    main {
      width: min(1144px, calc(100% - 48px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .workspace-section + .workspace-section { margin-top: 48px; }

    .workspace-section h2 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 600;
    }

    .section-description {
      max-width: 680px;
      margin: -12px auto 24px;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .catalog-card {
      position: relative;
      height: 132px;
      min-width: 0;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }

    .catalog-card:hover {
      transform: translateY(-1px);
      background: var(--surface-hover);
      box-shadow: 0 4px 10px rgba(20,24,31,.10);
    }

    .catalog-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 600;
    }

    .catalog-description {
      margin-top: 7px;
      padding-right: 52px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .catalog-logo {
      position: absolute;
      width: 52px;
      height: 52px;
      right: 0;
      bottom: 0;
      object-fit: contain;
      object-position: right bottom;
    }

    .search-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 12vh 20px 20px;
      background: var(--overlay);
    }

    .search-overlay.open { display: flex; }

    .search-dialog {
      width: min(680px, 100%);
      max-height: 70vh;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 18px 60px rgba(0,0,0,.24);
    }

    .search-input-wrap {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    #workspace-search-input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }

    #workspace-search-input:focus {
      border-color: color-mix(in srgb, var(--text) 35%, var(--border));
    }

    .search-results {
      max-height: calc(70vh - 76px);
      overflow-y: auto;
      padding: 8px;
    }

    .search-result {
      display: block;
      padding: 11px 12px;
      border-radius: 9px;
      color: var(--text);
      text-decoration: none;
    }

    .search-result:hover { background: var(--surface-hover); }

    .search-result-title {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .search-result-meta,
    .search-result-snippet {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .search-result-snippet {
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .search-empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 920px) {
      .catalog-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .topbar-inner,
      main { width: min(100% - 32px, 1144px); }

      .catalog-grid { grid-template-columns: 1fr; }
      .workspace-section h2 { font-size: 22px; }
    }
  </style>

      const readTheme = () => {
        const attr =
          document.documentElement.getAttribute("data-theme") ||
          document.body?.getAttribute("data-theme");

        if (attr === "light" || attr === "dark") return attr;

        try {
          const raw = localStorage.getItem("app-settings-cache");
          if (raw) {
            const parsed = JSON.parse(raw);
            const theme = parsed?.state?.values?.general?.theme;
            if (theme === "light" || theme === "dark") return theme;
          }
        } catch {}

        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      };

      const applyFavicon = () => {
        const link = document.getElementById("bsm-favicon");
        if (!link) return;
        link.href = readTheme() === "dark" ? darkIcon : lightIcon;
      };

      applyFavicon();

      new MutationObserver(applyFavicon).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme", "class"],
      });

      window.addEventListener("storage", applyFavicon);
      window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener?.("change", applyFavicon);
    })();

  <script>
    const SEARCH_INDEX = [{"catalog":"Посты","title":"Про мой опыт с ИИ в системном анализе","href":"./posts/2026-avgust/2026-08-28-mysli-pro-ispolzovanie-ii-v-sistemnom/","text":"Проблема со временем и как ее решать Самая большая проблема это время. Как и ИИ все подробно описать, и самому уложиться в сроки? Простого ответа нет. Учитесь быстро печатать. Слепая печать сильно помогает, когда нужно быстро фиксировать контекст и мысли. Поставьте приложение для надиктовывания текста. Например, Handy. Больше практикуйтесь. Нужно время, чтобы привыкнуть к такому формату работы. Просите ИИ генерировать часть вспомогательных артефактов. Например, попросите его изучить кодовую базу, найти все, что относится к задаче, записать выжимку в assets/ или другую папку и обновить AGENTS.md . Записывайте встречи и прогоняйте их через программы транскрибаторы. Есть много опенсорсных вариантов. Переиспользуйте свой труд. Сделайте шаблон папки с задачей. Отдельно храните шаблоны оформления задач и требований. Тогда не придется каждый раз объяснять одно и то же. Достаточно указать модели, где лежат нужные шаблоны. Практический пример Все это довольно очевидно, но как выглядит на практике? Пока экспериментирую. На каждую задачу завожу отдельную папку и веду в ней всю работу. Внутри: AGENTS.md . Так называется, чтобы файл сразу попадал в контекст. Это главный хаб задачи. Здесь описываю саму задачу, что нужно сделать, где что искать, мысли в свободной форме, нужные репозитории, ссылки на задачи, страницы в Confluence и шаблоны. Модель при этом может сама ходить в Confluence и трекер задач. assets/ . Папка с транскрипциями встреч, содержимым обсуждений, описанием алгоритмов и другими вспомогательными материалами по задаче. Если хорошо выстроить контекст, общаться с моделью становится куда приятнее. ИИ с каждым месяцем становятся умнее, а доступный контекст растет. Все чаще причина глупого ответа заключается в недостатке информации, а не в каком то \"неправильном промпте\". Модель может рассказать, как что устроено в коде, что нужно доработать и какие неясные моменты остались. Можно чуть реже дергать разработчиков по вопросам, на которые модель способна ответить сама. Если контекст текущей сессии исчерпался, можно начать новую из той же папки. Модель сразу получает основной контекст задачи, поэтому не приходится заново все объяснять. С подробным контекстом модель качественнее проводит ревью и формирует артефакты. У нее есть описание задачи, код, обсуждения и примеры того, как должен выглядеть результат. За счет этого она может лучше готовить постановки и находить проблемы в требованиях. И не забывайте проверять все, что делает ИИ. Искусственный интеллект отлично генерирует правдоподобный текст и при этом регулярно пишет чушь. Вы аналитик, ответственность за требования остается на вас. Если ИИ плохо справляется с конкретной частью работы, сделайте ее сами. Совершенно необязательно отдавать все на откуп железяке."},{"catalog":"Посты","title":"Август 2026","href":"./posts/2026-avgust/","text":""},{"catalog":"AI Fluency","title":"Capabilities & limitations of AI models","href":"./ai_fluency/capabilities-limitations-of-ai-models/","text":"The most effective systems will rely on the strengths of humans and AI . Humans bring critical thinking, judgment, creativity, and ethical oversight that AI may struggle to replicate. AI others speed, scale, pattern recognition, and ability to process vast amounts of information. Capabilities Models can shift between tasks without additional training . AI models can write poetry, brainstorm ideas, help understand quantum computing, analyze quarterly business trends. Models can maintain the thread of a conversation . They can remember what you discussed earlier, build upon it. Example: if you mentioned your project deadline and refer back to it later within the conversation, the AI typically understands what you're talking about. Many LLMs can reach beyond their knowledge . They can use external tools and information sources. For example, they can search the web, process files, or even use other applications. Limitations Knowledge cutoff date . AI models are bounded by their training data. LLMs have a knowledge cutoff date based on when they were trained, the point after which they have no innate knowledge of the world. For example, a model with cutoff date of November 2024 means that it wasn't trained on any date after November 2024. Incorrect information . Models can learn and sometimes reproduce inaccuracies that were present in their training data. That happens because the training process doesn't verify every fact in the training data. Models can hallucinate . They can confidently state something that sounds plausible but is actually incorrect. AI context window . Every LLM has a limit to how much information it can consider during a single interaction. If this limit is exceeded, the AI won't be able to remember information that falls outside the window. Non deterministic outputs . LLMs are somewhat unpredictable. Ask the same question twice and you might get slightly different responses each time. Some LLMs offer settings that allow to control that randomness. This setting is often referred to as temperature. Limitations with complex reasoning tasks . LLMs might struggle with logical or mathematical problems requiring multiple steps. The good news is that newer models get better in reasoning step by step. Lack of access to data . If a model doesn't have access to a piece of data or tool that is needed to answer a question, then it shouldn't come as a surprise that it won't be able to answer the question."},{"catalog":"AI Fluency","title":"Delegation","href":"./ai_fluency/delegation/","text":"A closer look at delegation The delegation is about what work needs to be done, what work you should do yourself, and what work might be better suited to AI . Delegation will help you work effectively and efficiently with AI assistants. Delegation involves three key elements: Problem awareness : Understand the problem you're trying to solve Platform awareness : Know the strengths and limitations of AI systems Task delegation : Divide work between yourself and AI. Problem awareness If you don't understand your goals, work needed to be done, you will struggle to effectively work with AI . The most effective AI collaborators are experts in their fields first, and AI delegators second. What you need to do: Understand what you're trying to solve Understand the capabilities of available AI tools Break down the complex work into smaller parts Define who does what Answer the questions before involving any AI tools: What does \"success\" look like? What kind of thinking and work is needed to get there? Platform awareness You should know about available AI systems, about their capabilities and limitations . Experiment as often as you can with different AI systems and develop your own insights. Understand the strengths and limitations of available options. Which models perform best for the work you have in mind? Which systems prioritize speed, or creativity, depth, or accuracy? Task delegation Divide work between yourself and AI . Ask yourself questions: What can you automate with AI? Where would augmentation create more value than working separately? What should you do alone without AI? What can an agent do?"},{"catalog":"AI Fluency","title":"Generative AI fundamentals","href":"./ai_fluency/generative-ai-fundamentals-2/","text":"Generative AI AI systems that can create new content. Traditional AI AI systems that analyze and categorize existing data. Examples: Traditional AI . It might classify emails as spam or not based on patterns. Generative AI . It can write a completely new email for you. LLMs are generative AI. LLMs (Large Language Models) are trained to predict and generate human language. That's why they're called \"language models\". These models contain billions of parameters. That's why they're called \"large\". Parameters are mathematical values that determine how the model processes the information, somewhat like synaptic connections in your brain. Three pillars that made the LLM possible 1. Algorithms . There were algorithmic and architectural breakthroughs that fundamentally changed how AI systems learn. The development of transformer architecture in 2017 was a game changer. 2. Data . There's a lot of digital data that AI models can learn on. 3. Computation . Massive increase in computational power made it possible to train these complex models on all that data. These factors led to an discovery called \"scaling laws\". As models grew larger and trained on more data with more computing power, their performance improved in predictable ways. Steps of AI models training Pre training . You show the model text and ask it to predict what comes next. Through many iterations the model gradually refines its predictions. Thus it learns the patterns that make language coherent and meaningful. Fine tuning . They learn to follow instructions, provide helpful responses, avoid generating harmful content. This often involves human feedback to improve the model's performance. It also involves reinforcement learning which uses rewards and penalties to shape the model's behavior. Once the models are trained, they are deployed so you can interact with them. Important terms Prompt . In order to interact with a model you provide a prompt. Prompt is a text that the model reads and then generates a response. Context window . It's AI's working memory. It's a practical limit to how much information an LLM can consider at once. The context window includes your prompts, the AI responses, and any other information you've shared in your conversation. Characteristics that make generative AI powerful Ability to process vast amounts of information during training . That allows to learn complex patterns. In context learning ability . LLMs can adapt to new tasks based on instructions or examples in your prompt without requiring additional training. Emerging capabilities that arise from scale . As the models grow larger, they develop capabilities that weren't explicitly designed into them."},{"catalog":"AI Fluency","title":"Introduction","href":"./ai_fluency/introduction/","text":"Source: You will learn how to work fluently with AI. :::info AI Fluency is the ability to work with AI effectively, efficiently, ethically, and safely. ::: 4Ds are AI Fluency core competencies."},{"catalog":"AI Fluency","title":"2026-08-28. Лекция про AI пайплайны","href":"./ai_fluency/posts/pro/","text":"Еще немного про AI. Надеюсь, вас еще не тошнит. Кого тошнит, сори, но тема для меня интересная и временами хочется делиться своим рассуждениями на эту тему . Лекция про AI пайплайны Сходил на лекцию про AI пайплайны для требований. Если кратко, \"ну такое\". Нового особо не узнал, но одна мысль показалась полезной. Спикер работает в VK и занимается фриланс проектами. И там, и там ей можно пользоваться внешними моделями. С ИБ все согласовано, проблем нет. Использует Claude. Презентацию для выступления делала через ChatGPT. Пайплайны это набор повторяемых шагов с понятными входами, результатами, проверками и точками принятия решений. Грубо говоря: сначала собрать требования, потом их проанализировать, описать доки, навайбкодить прототип и все это добро проревьюить. Выступление было про то, как такие пайплайны собирать. И знаете как? Ни за что не догадаетесь. Дать модели большой промпт, который спикер сгенерировала через AI. AI сам нагенерит папки и наполнит их нужными документами. Дальше просить AI добавлять нужные фичи. ИИ типа сам все сделает. Что смутило: Что делать, если ИБ не позволяет пользоваться внешними моделями?. Спикер особо не уточняла. Упомянула, что в VK есть локальные модели, но они слабые и с маленьким контекстом. Занавес. Как эта красота будет работать в случае сложной логики?. На бэке, фронте и еще нескольких сервисах все может быть уже сильно сложнее, но это тоже осталось неясно. Спикер показала подход на примере одной фичи для банковского фриланс проекта. Нужно было добавить в UI какую то простую фичу, скопировав ее из Т Банка. Качество артефактов получилось такое себе, хотя времени нормально все проревьюить тоже особо не было. Может, я уже придираюсь, уж простите, но все чаще встречаю презентации, которые выглядят полезно: тема интересная, вроде есть ценная информация, а по итогу забрать с собой особенно нечего. Как бы полезно, а как бы и куча нюансов, из за которых ты это применить на практике не сможешь Самая полезная мысль нужно хорошо построить контекст для модели. Когда решаешь задачу, стоит дать ей подробное описание самой задачи и окружения, доступ к репозиториям с исходным кодом, шаблоны или примеры требований, транскрипты обсуждений с продактом и разработчиками."},{"catalog":"AI Fluency","title":"2026-08-14. Т1 x ГК «Юзтех»: «Системный анализ»","href":"./ai_fluency/posts/t1-x-gk-yuztekh-sistemnyy-analiz/","text":"Общая информация Сегодня посетил митап Т1 x ГК «Юзтех»: «Системный анализ» Общие впечатления Офлайн посещать подобные мероприятия куда интереснее, чем сидеть и слушать очередной онлайн митап. Бесплатные еда и вода. Такое любим, такое уважаем. Ещё выдавали подарки за интересные вопросы. Узнал не так много нового, но сходить определённо стоило. Времени на общение было не очень много, но кое что успели пообсуждать. Если приглашают на мероприятия по адресу Москва, м. Динамо, Ленинградский пр т, 36, стр. 41 (БЦ «Арена», 23 й этаж), советую сходить. Лекционный зал там довольно красивый. Далее выжимка из докладов. Как системному аналитику не спроектировать утечку данных в API Автор : Елизавета Акманова :::tip Главная мысль Продумывайте риски и не бойтесь отказываться от решений, которые могут породить много проблем в будущем. ::: Краткое содержание Кейс из работы компании: с какой проблемой столкнулись и как её решали. Иногда лучше вообще не делать фичу, если потенциальные проблемы от неё перевешивают пользу. Перед реализацией стоит несколько раз подумать, чем решение может аукнуться в будущем. Spec Driven Development для системного аналитика: как превратить неполные вводные в проверяемую API спецификацию Автор : Виктория Золотарёва :::tip Главная мысль ИИ помог одновременно ускорить разработку требований и повысить их качество. ::: Краткое содержание Рассказ о том, как в команде использовали ИИ для улучшения качества документации. Аналитик с помощью ИИ пишет спецификацию в GitLab. В качестве контекста ИИ получает стайл гайды в .md \\ файлах и документацию проекта. Спецификация хранится в отдельной ветке. На основе спецификации генерируется документация в Confluence, а разработчик пишет код. Затем изменения аналитика и разработчика объединяются. Использовали Cursor, а не локальные модели. Применение сторонних моделей для проекта предварительно согласовали с ИБ. По словам автора, скорость работы выросла, команда результатом довольна. Интересно, что сама инициатива изначально пришла от бэкенд разработчика. Подробнее: Архитектурные решения и компромиссы почему мы всё время делаем систему хуже Автор : Андрей Бураков :::tip Главная мысль Придумайте несколько вариантов решения, сравните их плюсы и минусы и отдельно подумайте не только о том, что каждый вариант улучшает, но и о том, что он ухудшает. ::: Краткое содержание У каждого решения есть плюсы и минусы. Поэтому практически любое изменение в чём то делает систему лучше, а в чём то хуже. Идеальное, но несуществующее решение система, которой вообще нет, но которая при этом выполняет бизнес задачу. Предлагаемый подход: определяем важные характеристики первого пришедшего в голову решения приоритизируем их добавляем вариант «оставить как есть» генерируем альтернативы сравниваем варианты выбираем наиболее подходящий документируем принятое решение. Если решение ничего не ухудшает, скорее всего, вы ещё не нашли его минусы. Если вариант решения только один, стоит придумать ещё. По возможности характеристики решений стоит выражать количественно. Доклад очень понравился. Мы перешли на API first, и это не помогло Автор : Никита Миронов :::tip Главная мысль Границы контрактов нужно явно фиксировать в самих контрактах. ::: Краткое содержание В контракте указали integer , но не определили минимальное и максимальное значения. По спецификации сгенерировали код: в Go получилось int64 , в iOS int64 , в Android int32 . Позже понадобилось добавить к значению префикс. В Android новое значение уже перестало помещаться в выбранный тип. Ещё была часть про форматно логический контроль. Было много мемов. Мемы понравились. Нашёл его сайт:"},{"catalog":"AI Fluency","title":"Posts","href":"./ai_fluency/posts/","text":""},{"catalog":"AI Fluency","title":"The 4D Framework","href":"./ai_fluency/the-4d-framework/","text":"AI Fluency includes 4 core competences (4D): Delegation, Description, Discernment, Diligence. These competences aren't tied to specific AI tools or techniques that might become outdated. They're fundamental skills that will help you with this technology. Delegation Decide what you need to accomplish, what work to do with AI, what work to do yourself. Example. Imagine you work on a research project. AI might review lengthy documents and data. You might discuss with AI implications and findings. Yet reserve the final analysis and conclusion for yourself. How to delegate effectively: Understand your goal and the problem you need to solve . Know what AI systems can and can't do well . Decide how to divide the work between you and the AI . Description Communicate clearly with AI. Examples Creating a logo . \"Make me a logo\" is too vague. Describing your company's values, target audience, preferred colors, style references, and so on is a far better approach. Tutor . Imagine using AI as a tutor. You might make the extra step to specify \"Don't tell me the answer, just help me work through this problem step by step so I can better understand the concept\" What needs to be described: What you want the final output to be . How you want the AI to approach the task . The context and the information that the AI might need to best work with you on this task. How you want the AI to behave . Define the tone and style of the interaction. Discernment Evaluate AI outputs and behavior. Examples: Are the facts accurate? Does the reasoning make sense? Do the recommendations align with your brand values and audience? Does this output actually help you move forward? What needs to be evaluated: Is the output useful and correct? Is the AI taking the right approach? Is the AI behaving as desired? Diligence Use AI responsibly. Example. If you're using AI to help write job descriptions or review applications, how do you ensure fairness and controlling for potential biases? What to keep in mind: Ensure accuracy and take responsibility Honesty and transparency Ethical use and critical awareness"},{"catalog":"AI Fluency","title":"What is AI Fluency?","href":"./ai_fluency/what-is-ai-fluency/","text":"To get the maximum from the interactions with AI without wasting time and energy and in an honest and responsible way that protects the privacy and security of yourself and others 3 main ways how people engage with AI: Automation; Augmentation; Agency; Automation The AI completes specific tasks based on your instructions. You define what needs to be done and AI executes it. Examples of automation tasks: Summarize a document; Draft an email; Create an image; Plan a trip; That works well when you have a clear outcome in mind. But it might be challenging when you're not quite sure what you're looking for. Augmentation You and AI work together to solve problems . AI doesn't automate a task. It becomes your partner. It doesn't do work for you, but helps you do your work better. Examples: Writing . Imagine you're developing a character for a story. You're feeling stuck. You might explore this through conversation with the AI assistant. AI might help to bounce ideas back and forth, elaborate on stories, experiment with dialogue, refine your character. Programming . You're working through a difficult architectural problem with AI in an app that you're building. Research . You're trying to formulate your thoughts on a complex research topic. This approach works best when solutions aren't straightforward and you need to explore and experiment. Agency AI works independently on your behalf . You define its knowledge and behavior patterns. You don't provide the AI the exact instructions. You more like set a vision for AI. Examples: Set up an AI assistant to categorize emails by topic or urgency, draft responses for the most urgent ones. Create an everchanging interactive experience for visitors to your website Power a dynamically interactive character in a game. About those approaches None of them is better than the others. They serve different purposes and work the best in different situations. You might even use all three in a single project. Many start with automation. We think that augmentation and agency work the best today. These approaches lead to the most creative and effective solutions."},{"catalog":"AI Fluency","title":"BA/SA Materials","href":"./ai_fluency/","text":""}];

    const themeButton = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      document.body.setAttribute("data-theme", theme);
      themeIcon.innerHTML = theme === "dark"
        ? "\n<svg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n  <path d=\"M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3Z\"\n    stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/>\n</svg>"
        : "\n<svg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n  <circle cx=\"12\" cy=\"12\" r=\"4\" stroke=\"currentColor\" stroke-width=\"1.8\"/>\n  <path d=\"M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42\"\n    stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n</svg>";
    }

    applyTheme(window.__readGramaxTheme__());

    themeButton.addEventListener("click", () => {
      const current = window.__readGramaxTheme__();
      const next = current === "dark" ? "light" : "dark";
      window.__setGramaxTheme__(next);
      applyTheme(next);
    });

    window.addEventListener("storage", (event) => {
      if (event.key === window.__GRAMAX_SETTINGS_KEY__) {
        applyTheme(window.__readGramaxTheme__());
      }
    });

    const overlay = document.getElementById("search-overlay");
    const searchButton = document.getElementById("search-button");
    const input = document.getElementById("workspace-search-input");
    const results = document.getElementById("search-results");

    function openSearch() {
      overlay.classList.add("open");
      input.focus();
      input.select();
      renderSearch();
    }

    function closeSearch() {
      overlay.classList.remove("open");
    }

    function escapeHtmlClient(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderSearch() {
      const query = input.value.trim().toLocaleLowerCase();

      if (!query) {
        results.innerHTML = '<div class="search-empty">Start typing to search all catalogs.</div>';
        return;
      }

      const matches = SEARCH_INDEX
        .map((item) => {
          const title = item.title.toLocaleLowerCase();
          const text = item.text.toLocaleLowerCase();
          let score = 0;

          if (title === query) score += 100;
          if (title.startsWith(query)) score += 50;
          if (title.includes(query)) score += 25;
          if (text.includes(query)) score += 5;

          return { item, score };
        })
        .filter((entry) => entry.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 20);

      if (!matches.length) {
        results.innerHTML = '<div class="search-empty">No results.</div>';
        return;
      }

      results.innerHTML = matches.map(({ item }) => {
        const lower = item.text.toLocaleLowerCase();
        const pos = lower.indexOf(query);
        const start = Math.max(0, pos >= 0 ? pos - 80 : 0);
        const snippet = item.text.slice(start, start + 220).trim();

        return `
          <a class="search-result" href="${item.href}">
            <div class="search-result-title">${escapeHtmlClient(item.title)}</div>
            <div class="search-result-meta">${escapeHtmlClient(item.catalog)}</div>
            <div class="search-result-snippet">${escapeHtmlClient(snippet)}</div>
          </a>
        `;
      }).join("");
    }

    searchButton.addEventListener("click", openSearch);
    input.addEventListener("input", renderSearch);

    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeSearch();
    });

    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        openSearch();
      }

      if (event.key === "Escape") closeSearch();
    });
  </script>
