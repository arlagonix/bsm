  <script>const SETTINGS_STORAGE_KEY = "app-settings-cache";

const isTheme = (value) => value === "dark" || value === "light";

const getPersistedTheme = () => {
	try {
		const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
		if (!raw) return null;

		const parsed = JSON.parse(raw);
		const theme = parsed?.state?.values?.general?.theme;
		return isTheme(theme) ? theme : null;
	} catch {
		return null;
	}
};

const applyTheme = (theme) => {
	document.documentElement.className = theme;

	if (document.body) {
		document.body.dataset.theme = theme;
		return;
	}

	document.addEventListener(
		"DOMContentLoaded",
		() => {
			document.body.dataset.theme = theme;
		},
		{ once: true },
	);
};

const persistedTheme = getPersistedTheme();
const legacyTheme = localStorage.getItem("theme");
const fallbackTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
const theme = [persistedTheme, legacyTheme, fallbackTheme].find(isTheme) ?? "light";

applyTheme(theme);
</script>

      const readTheme = () => {
        const attr =
          document.documentElement.getAttribute("data-theme") ||
          document.body?.getAttribute("data-theme");

        if (attr === "light" || attr === "dark") return attr;

        try {
          const raw = localStorage.getItem("app-settings-cache");
          if (raw) {
            const parsed = JSON.parse(raw);
            const theme = parsed?.state?.values?.general?.theme;
            if (theme === "light" || theme === "dark") return theme;

        } catch {}

        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";

      const applyFavicon = () => {
        const link = document.getElementById("bsm-favicon");
        if (!link) return;
        link.href = readTheme() === "dark" ? darkIcon : lightIcon;
      };

      applyFavicon();

      new MutationObserver(applyFavicon).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme", "class"],
      });

      window.addEventListener("storage", applyFavicon);
      window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener?.("change", applyFavicon);
